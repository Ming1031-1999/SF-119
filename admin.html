<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日救護車檢查 - 幹部簽核後台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; margin: 0; padding: 12px; }
    .header { background: #0f172a; color: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: white; padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .card-title { font-weight: bold; font-size: 1.05rem; color: #1e3a8a; }
    .card-sub { font-size: 0.85rem; color: #64748b; margin: 4px 0 8px 0; }
    
    .metrics-box {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      font-size: 0.88rem;
      border-left: 4px solid #3b82f6;
    }
    .metrics-title { font-weight: bold; color: #1e3a8a; margin-bottom: 4px; }
    .metric-item { margin: 2px 0; color: #334155; }
    
    .badge-danger { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .btn-approve { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; }
    .btn-resolve { background: #3b82f6; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .btn-unlock { background: #8b5cf6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.82rem; cursor: pointer; }
    
    .section-header { font-weight: bold; margin: 16px 0 8px 4px; color: #334155; }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top: 2px solid #1e3a8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-flex {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      font-size: 0.88rem;
      padding: 8px 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1 style="margin:0; font-size:1.2rem;">🛡️ 救護檢查 - 幹部審核後台</h1>
      <p style="margin:4px 0 0 0; font-size:0.8rem; opacity:0.8;">每日簽核與缺失補充追蹤</p>
    </div>
    <button class="btn-unlock" onclick="unlockManagerMode()">🔒 解鎖管理者功能</button>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <label style="font-weight:bold; font-size:0.9rem;">選擇簽核幹部：</label>
    <select id="reviewerSelect" style="width:100%; padding:10px; margin-top:6px; box-sizing:border-box; font-size:0.95rem; border-radius:8px; border:1px solid #cbd5e1;">
      <option value="">⏳ 載入幹部名單中...</option>
    </select>
  </div>

  <div class="section-header">📌 待簽核清單</div>
  <div id="recordsContainer">
    <div class="loading-flex"><div class="spinner"></div> 正在讀取簽核單...</div>
  </div>

  <div class="section-header">🚨 待處置缺失項目</div>
  <div id="issuesContainer">
    <div class="loading-flex"><div class="spinner"></div> 正在讀取缺失項目...</div>
  </div>

  <div id="managerAuditArea" style="display: none; margin-top: 24px; border-top: 2px dashed #cbd5e1; padding-top: 16px;">
    <div class="section-header" style="color: #6b21a8; font-size: 1.1rem;">👑 管理者專屬：歷史數據明細稽核</div>
    <div class="card" style="background: #faf5ff; border-color: #d8b4fe;">
      <label style="font-weight:bold; font-size:0.9rem; color: #581c87;">選取歷史檢查單號進行稽核：</label>
      <select id="historyCheckSelect" style="width:100%; padding:10px; margin-top:6px; font-size:0.95rem; border-radius:8px; border:1px solid #c084fc;" onchange="viewCheckDetail()">
        <option value="">-- 請選擇欲稽核的歷史單號 --</option>
      </select>
      <div id="historyDetailBox" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyBXwfnayjato5donoxrdOUVtv45EihyOU1tYxq8Nix2DsB6AtRBEP1pu4ohc4lrRs_0A/exec";
    const MANAGER_PIN = "1199"; 
    
    let allHistoricalRecords = [];
    let itemLookupMap = {};

    window.onload = function() {
      loadInitData();
      loadPendingData();
    };

    function loadInitData() {
      fetch(`${GAS_API_URL}?action=getInitData`)
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            if (res.data.items) {
              res.data.items.forEach(i => {
                const id = String(i.Item_ID || i.itemId || '').trim();
                const name = i.Item_Name || i.itemName || '';
                if (id && name) itemLookupMap[id] = name;
              });
              
              if (allHistoricalRecords.length > 0) {
                renderRecords(allHistoricalRecords);
              }
            }

            if (res.data.users) {
              const select = document.getElementById('reviewerSelect');
              const reviewers = res.data.users.filter(u => u.Role === 'reviewer' || u.Role === 'admin');
              const list = reviewers.length > 0 ? reviewers : res.data.users;
              select.innerHTML = '<option value="">-- 請選擇簽核幹部 --</option>' + 
                list.map(u => `<option value="${u.User_Name}">${u.User_Name}</option>`).join('');
            }
          }
        })
        .catch(err => {
          document.getElementById('reviewerSelect').innerHTML = '<option value="">⚠️ 載入失敗，請重試</option>';
        });
    }

    function parseItemName(d) {
      if (!d) return "器材項目";
      const itemId = String(d.Item_ID || d.itemId || d.ItemID || '').trim();
      if (itemId && itemLookupMap[itemId]) return itemLookupMap[itemId];

      for (let key in d) {
        const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanKey === 'itemname' || cleanKey === 'item' || key.includes('項目') || key.includes('名稱') || key.includes('器材')) {
          if (d[key] && String(d[key]).trim() !== '' && d[key] !== 'undefined') return d[key];
        }
      }
      const values = Object.values(d);
      if (values[2] && String(values[2]).trim() !== '' && values[2] !== 'undefined') return values[2];
      return "器材項目";
    }

    function parseInputValue(d) {
      if (!d) return "";
      for (let key in d) {
        const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanKey === 'inputvalue' || cleanKey === 'value' || key.includes('數值') || key.includes('填寫')) {
          if (d[key] !== undefined) return d[key];
        }
      }
      const values = Object.values(d);
      return values[3] !== undefined ? values[3] : (d.Input_Value || d.inputValue || "");
    }

    function loadPendingData() {
      fetch(`${GAS_API_URL}?action=getPendingData`)
        .then(res => res.json())
        .then(res => {
          if(res.success && res.data) {
            allHistoricalRecords = res.data.records || [];
            renderRecords(allHistoricalRecords);
            renderIssues(res.data.issues || []);
          }
        })
        .catch(err => {
          console.error("載入失敗：", err);
          document.getElementById('recordsContainer').innerHTML = '<div class="card" style="color:#ef4444;">⚠️ 讀取失敗！請刷新網頁重試。</div>';
        });
    }

    function renderRecords(records) {
      const container = document.getElementById('recordsContainer');
      if (!records || records.length === 0) {
        container.innerHTML = '<div class="card" style="color:#64748b;">🎉 目前沒有待簽核的檢查單！</div>';
        return;
      }

      container.innerHTML = records.map(r => {
        let timeDisplay = String(r.Timestamp || '');
        if (timeDisplay.includes('T')) {
          timeDisplay = timeDisplay.replace('T', ' ').substring(0, 19);
        }

        let metricsHtml = '';
        if (r.details && r.details.length > 0) {
          // 精準過濾：只留下「異常項目」或「電量/氣壓/壓力相關必填項目」
          const keyDetails = r.details.filter(d => {
            const name = parseItemName(d);
            const isAbnormal = d.Is_Abnormal === 'TRUE' || d.Is_Abnormal === true || d.isAbnormal === true;
            const isMetricItem = /電量|氣壓|壓力|氧氣|psi|zoll|機|電/i.test(name);

            return isAbnormal || isMetricItem;
          });

          if (keyDetails.length > 0) {
            const detailList = keyDetails.map(d => {
              const name = parseItemName(d);
              const val = parseInputValue(d);
              const isAbnormal = d.Is_Abnormal === 'TRUE' || d.Is_Abnormal === true || d.isAbnormal === true;
              const note = d.Item_Note || d.itemNote || '';

              const mark = isAbnormal ? ' ⚠️<span style="color:#ef4444; font-weight:bold;">(缺失/低於標準)</span>' : '';
              const noteText = note ? ` <span style="color:#64748b;">[備註: ${note}]</span>` : '';
              return `<div class="metric-item">• <strong>${name}</strong>: ${val}${mark}${noteText}</div>`;
            }).join('');

            metricsHtml = `
              <div class="metrics-box">
                <div class="metrics-title">📊 關鍵數據 (電量/氣壓) 與報欠缺失明細：</div>
                ${detailList}
              </div>
            `;
          }
        }

        return `
          <div class="card">
            <button class="btn-approve" onclick="approveCheck('${r.Check_ID}')">✅ 批准簽核</button>
            <div class="card-title">${r.Vehicle_Name} 救護車</div>
            <div class="card-sub">清點同仁：${r.Checker} | 時間：${timeDisplay}</div>
            ${metricsHtml}
            <div style="font-size:0.85rem; color:#475569; margin-top:4px;">整體備註：${r.General_Note || '無'}</div>
          </div>
        `;
      }).join('');
    }

    function renderIssues(issues) {
      const container = document.getElementById('issuesContainer');
      if (!issues || issues.length === 0) {
        container.innerHTML = '<div class="card" style="color:#64748b;">✅ 目前無缺件或待處置項目！</div>';
        return;
      }

      container.innerHTML = issues.map(i => {
        const name = parseItemName(i);
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span class="badge-danger">${i.Vehicle_Name}</span>
                <strong style="margin-left:6px;">${name}</strong>
              </div>
              <button class="btn-resolve" onclick="resolveIssue('${i.Issue_ID}')">已補充結案</button>
            </div>
            <div class="card-sub" style="margin-top:6px;">現有數值：${i.Actual_Qty} (標準：${i.Standard_Qty}) | 原因：${i.Unresolved_Reason}</div>
          </div>
        `;
      }).join('');
    }

    function unlockManagerMode() {
      const pwd = prompt("🔐 請輸入管理者解鎖 PIN 碼：");
      if (pwd === MANAGER_PIN) {
        alert("✅ 解鎖成功！已載入管理者稽核功能。");
        document.getElementById('managerAuditArea').style.display = 'block';
        populateHistoryDropdown();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else if (pwd !== null) {
        alert("❌ 密碼錯誤，無法解鎖！");
      }
    }

    function populateHistoryDropdown() {
      const select = document.getElementById('historyCheckSelect');
      if (!allHistoricalRecords || allHistoricalRecords.length === 0) {
        select.innerHTML = '<option value="">目前無歷史清點單據</option>';
        return;
      }
      select.innerHTML = '<option value="">-- 請選擇欲稽核的檢查單號 --</option>' + 
        allHistoricalRecords.map(r => {
          let timeDisplay = String(r.Timestamp || '');
          if (timeDisplay.includes('T')) timeDisplay = timeDisplay.replace('T', ' ').substring(0, 19);
          return `<option value="${r.Check_ID}">${timeDisplay} - ${r.Vehicle_Name}車 (${r.Checker}) [${r.Review_Status}]</option>`;
        }).join('');
    }

    function viewCheckDetail() {
      const checkId = document.getElementById('historyCheckSelect').value;
      const box = document.getElementById('historyDetailBox');
      if (!checkId) { box.innerHTML = ''; return; }

      const record = allHistoricalRecords.find(r => r.Check_ID === checkId);
      if (!record || !record.details) {
        box.innerHTML = '<div style="color:#64748b;">查無此單號明細。</div>';
        return;
      }

      const detailRows = record.details.map(d => {
        const name = parseItemName(d);
        const val = parseInputValue(d);
        const isAbnormal = d.Is_Abnormal === 'TRUE' || d.Is_Abnormal === true || d.isAbnormal === true;
        const note = d.Item_Note || d.itemNote || '-';

        const statusTag = isAbnormal ? '<span style="color:#ef4444; font-weight:bold;">⚠️ 異常</span>' : '<span style="color:#10b981;">✅ 正常</span>';
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:6px; font-size:0.85rem;">${name}</td>
            <td style="padding:6px; font-size:0.85rem; font-weight:bold;">${val}</td>
            <td style="padding:6px; font-size:0.85rem;">${statusTag}</td>
            <td style="padding:6px; font-size:0.8rem; color:#64748b;">${note}</td>
          </tr>
        `;
      }).join('');

      box.innerHTML = `
        <div style="background:#ffffff; padding:10px; border-radius:8px; border:1px solid #e9d5ff; margin-top:8px;">
          <div style="font-weight:bold; color:#6b21a8; margin-bottom:6px;">📋 完整清點明細數據表：</div>
          <table style="width:100%; border-collapse:collapse; text-align:left;">
            <thead>
              <tr style="border-bottom:2px solid #e9d5ff; font-size:0.85rem; color:#6b21a8;">
                <th>器材項目</th><th>填寫數據</th><th>判定</th><th>備註</th>
              </tr>
            </thead>
            <tbody>${detailRows}</tbody>
          </table>
        </div>
      `;
    }

    function approveCheck(checkId) {
      const reviewer = document.getElementById('reviewerSelect').value;
      if (!reviewer) {
        alert("⚠️ 請先在最上方選擇簽核幹部姓名！");
        return;
      }

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'approveCheck', payload: { checkId: checkId, reviewer: reviewer } })
      }).then(res => res.json()).then(res => {
        if(res.success) {
          alert("✅ 簽核完成！");
          loadPendingData();
        }
      });
    }

    function resolveIssue(issueId) {
      const reviewer = document.getElementById('reviewerSelect').value;
      if (!reviewer) {
        alert("⚠️ 請先在最上方選擇簽核幹部姓名！");
        return;
      }

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'resolveIssue', payload: { issueId: issueId, reviewer: reviewer } })
      }).then(res => res.json()).then(res => {
        if(res.success) {
          alert("✅ 缺失已成功結案！");
          loadPendingData();
        }
      });
    }
  </script>
</body>
</html>
