<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SF-119 救護車輛與器材清點系統</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --success: #059669;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-sub: #475569;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
      padding-bottom: 90px;
      font-size: 16px;
    }

    .top-header {
      background: linear-gradient(135deg, #1e3a8a, #1e40af);
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .top-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; }
    
    .config-bar { display: flex; gap: 8px; }
    .config-select {
      flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #93c5fd;
      background: #ffffff; color: #0f172a; font-weight: 800; font-size: 0.9rem;
    }

    .quick-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-quick-fill {
      flex: 1.2; background: var(--success-bg); color: #065f46;
      border: 1.5px solid #a7f3d0; padding: 10px; border-radius: 8px;
      font-weight: 800; font-size: 0.9rem; display: flex; align-items: center;
      justify-content: center; gap: 4px; cursor: pointer;
    }
    .btn-toggle-filter {
      flex: 1; background: #ffffff; color: #334155;
      border: 1.5px solid var(--border); padding: 10px; border-radius: 8px;
      font-weight: 700; font-size: 0.88rem; cursor: pointer;
    }
    .btn-toggle-filter.active { background: var(--danger-bg); color: #991b1b; border-color: #fca5a5; }

    .step-nav { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
    .step-btn {
      flex: 1; min-width: 110px; padding: 9px 6px; background: #e2e8f0;
      color: #475569; border: none; border-radius: 8px; font-size: 0.88rem;
      font-weight: 800; text-align: center; cursor: pointer; white-space: nowrap;
    }
    .step-btn.active { background: var(--primary); color: white; }

    .group-box { border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px; margin-bottom: 12px; background: #ffffff; }
    .group-header { font-size: 1.05rem; font-weight: 900; padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; color: white; background: #1e3a8a; }

    .sub-pack-box {
      background: #f8fafc; border: 1.5px dashed #94a3b8; border-radius: 10px;
      padding: 8px; margin: 8px 0;
    }
    .sub-pack-header {
      font-size: 0.95rem; font-weight: 800; color: #1e293b;
      padding-bottom: 4px; border-bottom: 1px solid #e2e8f0; margin-bottom: 6px;
    }

    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; background: #ffffff; border: 1px solid #e2e8f0;
      border-radius: 8px; margin-bottom: 6px; min-height: 48px;
    }
    .item-row.is-abnormal { border-color: #fca5a5; background-color: var(--danger-bg); }

    .item-left { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 8px; }
    .item-title-wrap { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .item-name { font-weight: 800; font-size: 1.05rem; color: #0f172a; }
    .item-std-tag { font-size: 0.82rem; font-weight: 800; color: #0284c7; background: #e0f2fe; padding: 1px 6px; border-radius: 4px; }
    .item-sub-hint { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

    .stepper { display: flex; align-items: center; border: 1.5px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #f8fafc; }
    .btn-step { width: 36px; height: 36px; border: none; background: #f1f5f9; color: #1e3a8a; font-size: 1.3rem; font-weight: 900; cursor: pointer; }
    .btn-step:active { background: #cbd5e1; }
    .stepper-val { width: 40px; text-align: center; font-weight: 900; font-size: 1.15rem; color: #0f172a; height: 36px; line-height: 36px; }
    .stepper-val.val-low { color: var(--danger); background: #fee2e2; }

    .quick-preset-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .quick-preset-btns { display: flex; gap: 4px; }
    .btn-preset { background: #e2e8f0; color: #1e293b; border: none; border-radius: 4px; padding: 3px 6px; font-size: 0.78rem; font-weight: 800; cursor: pointer; }
    .pressure-input { width: 86px; height: 36px; padding: 4px 8px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-weight: 900; font-size: 1.05rem; text-align: right; }

    .status-select { height: 36px; padding: 0 6px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-weight: 800; font-size: 0.9rem; background: white; }

    .note-drawer { display: none; margin-top: -2px; margin-bottom: 8px; padding: 0 4px; }
    .note-drawer input { width: 100%; padding: 8px 10px; border: 1.5px solid #fca5a5; background: #fef2f2; border-radius: 6px; font-size: 0.9rem; color: #991b1b; font-weight: 600; }

    .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 10px 14px; border-top: 1.5px solid var(--border); box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.08); z-index: 100; display: flex; gap: 8px; }
    .btn-prev { flex: 1; background: #64748b; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer; }
    .btn-next { flex: 2; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer; }

    .loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; z-index: 999; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div style="font-size: 1.2rem; margin-bottom: 8px;">🔄 正在連線至 Google 試算表...</div>
    <div style="font-size: 0.85rem; color: #64748b;">讀取 Item_List、Vehicle_List 與 User_List 中</div>
  </div>

  <div class="top-header">
    <h1>🚑 SF-119 每日救護車檢查系統</h1>
    <div class="config-bar">
      <select id="vehicleSelect" class="config-select">
        <option value="">載入車輛中...</option>
      </select>
      <select id="userSelect" class="config-select">
        <option value="">選擇檢查同仁...</option>
      </select>
    </div>
  </div>

  <div class="quick-toolbar">
    <button class="btn-quick-fill" onclick="quickFillAll()">⚡ 一鍵本頁全齊（預設滿量）</button>
    <button class="btn-toggle-filter" id="filterBtn" onclick="toggleFilterMissing()">🔍 僅顯示缺件/必填</button>
  </div>

  <div class="step-nav" id="stepNav"></div>

  <div id="checklistContainer"></div>

  <div class="submit-bar">
    <button id="prevBtn" class="btn-prev" onclick="stepChange(-1)" style="display: none;">⬅️ 上一步</button>
    <button id="nextBtn" class="btn-next" onclick="stepChange(1)">下一步 ➔</button>
  </div>

  <script>
    // ⚠️ 請修改為你的 Apps Script Web App URL
    const GAS_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_SCRIPT_ID/exec";

    let sessionToken = "";
    let treeData = {}; 
    let cat1List = [];
    let currentStep = 0;
    let isFilterMode = false;

    // 1. 初始化，發起 doGet action=getInitData
    async function initSystem() {
      try {
        const res = await fetch(`${GAS_URL}?action=getInitData`);
        const result = await res.json();

        if (result.success) {
          sessionToken = result.data.sessionToken;
          populateConfig(result.data.vehicles, result.data.users);
          buildTreeData(result.data.items);
          renderUI();
        } else {
          alert("讀取試算表失敗：" + result.error);
        }
      } catch (err) {
        console.error("API 連線失敗:", err);
        alert("無法連線至後端伺服器，請確認 GAS_URL 設定是否正確！");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function populateConfig(vehicles, users) {
      const vSelect = document.getElementById('vehicleSelect');
      const uSelect = document.getElementById('userSelect');

      vSelect.innerHTML = vehicles.map(v => {
        const name = v.Vehicle_Name || v.Vehicle_No || v.Name || Object.values(v)[0];
        return `<option value="${name}">${name}</option>`;
      }).join('');

      uSelect.innerHTML = `<option value="">請選擇檢查同仁</option>` + users.map(u => {
        const name = u.User_Name || u.Name || Object.values(u)[0];
        return `<option value="${name}">${name}</option>`;
      }).join('');
    }

    // 將 Item_List 的資料依據 Category_1 ➔ Category_2 進行雙層樹狀結構打包
    function buildTreeData(items) {
      treeData = {};
      items.forEach(item => {
        const c1 = item.Category_1 || '未分類';
        const c2 = item.Category_2 || '一般裝備';

        if (!treeData[c1]) treeData[c1] = {};
        if (!treeData[c1][c2]) treeData[c1][c2] = [];

        treeData[c1][c2].push(item);
      });
      cat1List = Object.keys(treeData);
    }

    // 2. 動態渲染介面
    function renderUI() {
      const navContainer = document.getElementById('stepNav');
      const listContainer = document.getElementById('checklistContainer');
      navContainer.innerHTML = '';
      listContainer.innerHTML = '';

      cat1List.forEach((c1Name, idx) => {
        // 第一層導覽按鈕 (Category_1)
        const navBtn = document.createElement('button');
        navBtn.className = `step-btn ${idx === 0 ? 'active' : ''}`;
        navBtn.innerText = `${idx + 1}. ${c1Name}`;
        navBtn.onclick = () => switchTab(idx);
        navContainer.appendChild(navBtn);

        // 分頁面板
        const panel = document.createElement('div');
        panel.id = `tab_${idx}`;
        panel.className = 'tab-panel';
        panel.style.display = idx === 0 ? 'block' : 'none';

        let html = '';

        // 第二層模組/子包 (Category_2)
        Object.keys(treeData[c1Name]).forEach(c2Name => {
          const isSubModule = c2Name.includes('-'); // 判斷是否為內層子包 (如: 急救包-血糖包)
          
          if (isSubModule) {
            html += `<div class="sub-pack-box"><div class="sub-pack-header">👝 內層模組：${c2Name}</div>`;
          } else {
            html += `<div class="group-box"><div class="group-header"><span>📦 ${c2Name}</span></div>`;
          }

          treeData[c1Name][c2Name].forEach(item => {
            const id = item.Item_ID;
            const name = item.Item_Name;
            const stdQty = parseInt(item.Standard_Qty, 10) || 0;
            const warnMin = parseInt(item.Warning_Min, 10) || 0;
            const hint = item.Item_Hint || '';
            const type = (item.Input_Type || '').toLowerCase();

            if (type.includes('mandatory') || type.includes('num') || stdQty > 50) {
              // 壓力/大數值型態 (mandatory_num)
              html += `
                <div class="item-row" data-id="${id}" data-name="${name}" data-std="${stdQty}" data-type="pressure" data-mandatory="true" style="border-left: 5px solid #f59e0b;">
                  <div class="item-left">
                    <div class="item-title-wrap">
                      <span class="item-name">${name}</span>
                      <span style="color:#d97706; font-size:0.8rem; font-weight:bold;">⚠️ 關鍵數據</span>
                    </div>
                    ${hint ? `<span class="item-sub-hint">${hint}</span>` : ''}
                  </div>
                  <div class="item-right">
                    <div class="quick-preset-wrap">
                      <div class="quick-preset-btns">
                        <button class="btn-preset" onclick="setPressure('${id}', 2200, ${warnMin})">2200</button>
                        <button class="btn-preset" onclick="setPressure('${id}', 1500, ${warnMin})">1500</button>
                        <button class="btn-preset" onclick="setPressure('${id}', 1000, ${warnMin})">1000</button>
                      </div>
                      <input type="number" id="${id}" class="pressure-input" placeholder="psi" value="${stdQty}" oninput="checkPressure(this, ${warnMin})">
                    </div>
                  </div>
                </div>
                <div class="note-drawer"><input type="text" class="note-input" placeholder="⚠️ 數值偏低原因說明"></div>
              `;
            } else if (type.includes('stat')) {
              // 狀態型態 (optional_stat)
              html += `
                <div class="item-row" data-id="${id}" data-name="${name}" data-std="${stdQty}" data-type="status">
                  <div class="item-left">
                    <span class="item-name">${name}</span>
                    ${hint ? `<span class="item-sub-hint">${hint}</span>` : ''}
                  </div>
                  <div class="item-right">
                    <select class="status-select" onchange="toggleStatusNote(this)">
                      <option value="正常">✅ 正常</option>
                      <option value="異常">❌ 異常/待補</option>
                    </select>
                  </div>
                </div>
                <div class="note-drawer"><input type="text" class="note-input" placeholder="⚠️ 請填寫異常原因"></div>
              `;
            } else {
              // 數量加減型態 (optional_qty)
              html += `
                <div class="item-row" data-id="${id}" data-name="${name}" data-std="${stdQty}" data-warn="${warnMin}" data-type="qty">
                  <div class="item-left">
                    <div class="item-title-wrap">
                      <span class="item-name">${name}</span>
                      <span class="item-std-tag">應備 ${stdQty}</span>
                    </div>
                    ${hint ? `<span class="item-sub-hint">${hint}</span>` : ''}
                  </div>
                  <div class="item-right">
                    <div class="stepper">
                      <button class="btn-step" onclick="changeQty(this, -1, ${stdQty}, ${warnMin})">-</button>
                      <div class="stepper-val">${stdQty}</div>
                      <button class="btn-step" onclick="changeQty(this, 1, ${stdQty}, ${warnMin})">+</button>
                    </div>
                  </div>
                </div>
                <div class="note-drawer"><input type="text" class="note-input" placeholder="⚠️ 請填寫未補齊或短缺原因"></div>
              `;
            }
          });

          html += `</div>`;
        });

        panel.innerHTML = html;
        listContainer.appendChild(panel);
      });

      updateNavButtons();
    }

    // 3. 互動邏輯
    function changeQty(btn, delta, stdQty, warnMin) {
      const stepper = btn.parentElement;
      const valElem = stepper.querySelector('.stepper-val');
      const row = btn.closest('.item-row');
      const noteDrawer = row.nextElementSibling;

      let current = parseInt(valElem.innerText, 10) || 0;
      let updated = Math.max(0, current + delta);
      valElem.innerText = updated;

      // 判斷是否觸發短缺警示 (小於 Standard_Qty 或 Warning_Min)
      const threshold = warnMin > 0 ? warnMin : stdQty;
      if (updated < threshold) {
        valElem.classList.add('val-low');
        row.classList.add('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'block';
      } else {
        valElem.classList.remove('val-low');
        row.classList.remove('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'none';
      }
    }

    function toggleStatusNote(select) {
      const row = select.closest('.item-row');
      const noteDrawer = row.nextElementSibling;
      if (select.value === '異常') {
        row.classList.add('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'block';
      } else {
        row.classList.remove('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'none';
      }
    }

    function setPressure(inputId, val, warnMin) {
      const input = document.getElementById(inputId);
      if (input) {
        input.value = val;
        checkPressure(input, warnMin);
      }
    }

    function checkPressure(input, warnMin) {
      const val = parseFloat(input.value) || 0;
      const row = input.closest('.item-row');
      const noteDrawer = row.nextElementSibling;
      const limit = warnMin > 0 ? warnMin : 1000;

      if (val < limit) {
        row.classList.add('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'block';
      } else {
        row.classList.remove('is-abnormal');
        if (noteDrawer) noteDrawer.style.display = 'none';
      }
    }

    function quickFillAll() {
      const currentTab = document.getElementById(`tab_${currentStep}`);
      currentTab.querySelectorAll('.item-row[data-std]').forEach(row => {
        const std = parseInt(row.getAttribute('data-std'), 10);
        const valElem = row.querySelector('.stepper-val');
        if (valElem) { valElem.innerText = std; valElem.classList.remove('val-low'); }
        row.classList.remove('is-abnormal');
        const note = row.nextElementSibling;
        if (note && note.classList.contains('note-drawer')) note.style.display = 'none';
      });
    }

    function toggleFilterMissing() {
      isFilterMode = !isFilterMode;
      document.getElementById('filterBtn').classList.toggle('active', isFilterMode);
      document.querySelectorAll('.item-row').forEach(row => {
        const isMandatory = row.hasAttribute('data-mandatory');
        const isAbnormal = row.classList.contains('is-abnormal');
        row.style.display = (isFilterMode && !isMandatory && !isAbnormal) ? 'none' : 'flex';
      });
    }

    function switchTab(index) {
      currentStep = index;
      document.querySelectorAll('.tab-panel').forEach((panel, i) => panel.style.display = i === currentStep ? 'block' : 'none');
      document.querySelectorAll('.step-btn').forEach((btn, i) => btn.classList.toggle('active', i === currentStep));
      updateNavButtons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      prevBtn.style.display = currentStep === 0 ? 'none' : 'block';
      if (currentStep === cat1List.length - 1) {
        nextBtn.innerText = "🚀 送出清點紀錄至試算表";
        nextBtn.style.background = "var(--success)";
      } else {
        nextBtn.innerText = "下一步 ➔";
        nextBtn.style.background = "var(--primary)";
      }
    }

    function stepChange(delta) {
      if (currentStep + delta >= cat1List.length) {
        submitData();
        return;
      }
      switchTab(currentStep + delta);
    }

    // 4. 送出資料至 Apps Script (對應 doPost action=submitCheck)
    async function submitData() {
      const checker = document.getElementById('userSelect').value;
      const vehicleName = document.getElementById('vehicleSelect').value;

      if (!checker) {
        alert("⚠️ 請先在頂部選擇「檢查同仁」！");
        return;
      }

      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading').querySelector('div').innerText = '⏳ 寫入試算表中...';

      const itemsPayload = [];

      document.querySelectorAll('.item-row').forEach(row => {
        const itemId = row.getAttribute('data-id');
        const itemName = row.getAttribute('data-name');
        const stdQty = row.getAttribute('data-std') || '';
        const isAbnormal = row.classList.contains('is-abnormal');
        const noteInput = row.nextElementSibling ? row.nextElementSibling.querySelector('.note-input') : null;

        let val = '';
        const stepperVal = row.querySelector('.stepper-val');
        const pressureInput = row.querySelector('.pressure-input');
        const statusSelect = row.querySelector('.status-select');

        if (stepperVal) val = stepperVal.innerText;
        else if (pressureInput) val = pressureInput.value;
        else if (statusSelect) val = statusSelect.value;

        itemsPayload.push({
          itemId: itemId,
          itemName: itemName,
          inputValue: val,
          isAbnormal: isAbnormal,
          itemNote: noteInput ? noteInput.value : '',
          standardQty: stdQty
        });
      });

      const bodyData = {
        action: "submitCheck",
        sessionToken: sessionToken,
        honeypot: "",
        payload: {
          vehicleName: vehicleName,
          checker: checker,
          generalNote: "",
          items: itemsPayload
        }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(bodyData)
        });
        const res = await response.json();

        if (res.success) {
          alert("🎉 清點紀錄已成功寫入 Google 試算表！");
          location.reload();
        } else {
          alert("❌ 寫入失敗：" + res.error);
        }
      } catch (err) {
        console.error(err);
        alert("❌ 傳送過程發生錯誤，請檢查網路。");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    document.addEventListener("DOMContentLoaded", initSystem);
  </script>
</body>
</html>
